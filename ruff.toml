line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E501",  # long lines are left to the formatter
  "B008",  # FastAPI dependency defaults
  "SIM108",
]

[lint.per-file-ignores]
"backend/tests/*" = ["B011", "E402"]
"backend/rental_eval.py" = ["E402"]
"backend/alembic/*" = ["E402"]
