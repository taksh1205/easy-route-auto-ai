name: release-verification
on: [push, pull_request]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned: the pinned Playwright release does not support newer runner images.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EASY_EVIDENCE_DIR: ${{ github.workspace }}/ci-evidence
      EASY_TEST_POSTGRES_ADMIN_URL: postgresql://easy:testonly@localhost:5432/postgres
      HF_HUB_DISABLE_XET: '1'
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: easy, POSTGRES_PASSWORD: testonly, POSTGRES_DB: easy}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U easy"
          --health-interval 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-${{ runner.os }}-${{ hashFiles('backend/app/config.py') }}
      - name: Install backend
        run: |
          pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Install frontend and Chromium
        run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: All release gates
        # The runner records blocked gates explicitly and exits non-zero on any failure.
        run: python scripts/verify_release.py
      - name: Gate summary
        if: always()
        run: cat "$EASY_EVIDENCE_DIR/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            ci-evidence
            docs/v06/evaluations
